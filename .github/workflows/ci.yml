name: Validate Next.js app

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 1-login-page/package-lock.json

      - name: Install dependencies
        working-directory: 1-login-page
        run: npm ci

      - name: Lint
        working-directory: 1-login-page
        run: npm run lint

      - name: Build
        working-directory: 1-login-page
        run: npm run build
